<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login — DSPACE</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/admin/admin.css" />
</head>
<body class="login-body">

<div class="login-card">
  <img class="login-mark" src="/assets/icons/logo-mark.svg" alt="DSPACE" width="36" height="36" />
  <h1 class="login-title">DSPACE Admin</h1>
  <p class="login-sub">Sign in to manage properties, pricing, addresses and photos.</p>

  <form id="loginForm" class="login-form" autocomplete="off">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
    </div>
    <p id="loginError" class="login-error" hidden></p>
    <button type="submit" class="btn-gold" id="loginSubmit">Sign In</button>
  </form>

  <a href="/index.html" class="login-back">&larr; Back to site</a>
</div>

<script src="/admin/admin.js"></script>
</body>
</html>
