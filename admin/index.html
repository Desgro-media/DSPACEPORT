<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — DSPACE</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/admin/admin.css" />
</head>
<body class="admin-body" hidden>

<div id="toast" class="toast" hidden></div>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-brand">
      <img src="/assets/icons/logo-mark.svg" alt="" width="24" height="24" />
      <span>DSPACE <em>Admin</em></span>
    </div>
    <nav class="admin-nav">
      <button class="admin-nav__item is-active" data-view="properties">Properties</button>
      <button class="admin-nav__item" data-view="settings">Site Settings</button>
      <button class="admin-nav__item" data-view="team">Team</button>
    </nav>
    <div class="admin-sidebar__foot">
      <a href="/index.html" target="_blank" rel="noopener" class="admin-sidebar__link">View Site &rarr;</a>
      <span class="admin-sidebar__user" id="whoami"></span>
      <button id="logoutBtn" class="admin-sidebar__logout">Log Out</button>
    </div>
  </aside>

  <main class="admin-main">

    <!-- ---------------- PROPERTIES ---------------- -->
    <section id="view-properties" class="admin-view">
      <div class="admin-view__head">
        <div>
          <h1>Properties</h1>
          <p class="admin-view__sub">Manage listings, photos, pricing and addresses.</p>
        </div>
        <button class="btn-gold" id="addPropertyBtn">+ Add Property</button>
      </div>
      <div id="propertiesList" class="prop-grid"></div>
    </section>

    <!-- ---------------- SETTINGS ---------------- -->
    <section id="view-settings" class="admin-view" hidden>
      <div class="admin-view__head">
        <div>
          <h1>Site Settings</h1>
          <p class="admin-view__sub">Logo, contact details, office addresses and site photos.</p>
        </div>
        <button class="btn-gold" id="saveSettingsBtn">Save Settings</button>
      </div>
      <form id="settingsForm" class="settings-form"></form>
    </section>

    <!-- ---------------- TEAM ---------------- -->
    <section id="view-team" class="admin-view" hidden>
      <div class="admin-view__head">
        <div>
          <h1>Team</h1>
          <p class="admin-view__sub">Leadership photos shown on the About page.</p>
        </div>
        <button class="btn-gold" id="addTeamBtn">+ Add Team Member</button>
      </div>
      <div id="teamList" class="team-grid-admin"></div>
    </section>

  </main>
</div>

<!-- ---------------- MODAL (Property editor) ---------------- -->
<div id="propertyModal" class="modal" hidden>
  <div class="modal__panel modal__panel--wide">
    <div class="modal__head">
      <h2 id="propertyModalTitle">Add Property</h2>
      <button class="modal__close" data-close-modal>&times;</button>
    </div>
    <form id="propertyForm" class="modal__body">
      <input type="hidden" id="pf-id" />

      <div class="form-grid">
        <div class="field"><label>Name</label><input id="pf-name" required /></div>
        <div class="field"><label>Tag</label><input id="pf-tag" placeholder="Featured, New Listing…" /></div>
        <div class="field"><label>Status</label><input id="pf-status" placeholder="For Sale" /></div>
        <div class="field"><label>Type</label><input id="pf-type" placeholder="Villa, Apartment…" /></div>
        <div class="field"><label>Country Code</label><input id="pf-country" placeholder="UAE / India" /></div>
        <div class="field"><label>Country Label</label><input id="pf-countryLabel" placeholder="United Arab Emirates" /></div>
        <div class="field field--wide"><label>Address / City</label><input id="pf-city" placeholder="Palm Jumeirah, Dubai" /></div>
      </div>

      <h3 class="modal__section-title">Pricing</h3>
      <div class="form-grid">
        <div class="field"><label>Price</label><input id="pf-price" placeholder="AED 18,500,000" /></div>
        <div class="field"><label>Price Subtext</label><input id="pf-priceSub" placeholder="≈ USD 5.04M · ₹41.8 Cr" /></div>
        <div class="field"><label>Beds</label><input id="pf-beds" type="number" min="0" /></div>
        <div class="field"><label>Baths</label><input id="pf-baths" type="number" min="0" /></div>
        <div class="field"><label>Interior Area</label><input id="pf-area" placeholder="9,800 sq ft" /></div>
        <div class="field"><label>Plot Size</label><input id="pf-plot" placeholder="12,400 sq ft" /></div>
        <div class="field"><label>Year Built</label><input id="pf-year" placeholder="2023" /></div>
      </div>

      <h3 class="modal__section-title">Photos</h3>
      <div id="pf-cover-field"></div>
      <div id="pf-gallery-field"></div>

      <h3 class="modal__section-title">Description</h3>
      <div class="field"><label>Summary</label><textarea id="pf-summary" rows="2"></textarea></div>
      <div class="field"><label>Description (one paragraph per line)</label><textarea id="pf-description" rows="4"></textarea></div>
      <div class="field"><label>Features (one per line)</label><textarea id="pf-features" rows="4"></textarea></div>

      <h3 class="modal__section-title">Listing Agent</h3>
      <div class="form-grid">
        <div class="field"><label>Name</label><input id="pf-agentName" /></div>
        <div class="field"><label>Role</label><input id="pf-agentRole" /></div>
        <div class="field"><label>Phone</label><input id="pf-agentPhone" /></div>
        <div class="field"><label>Email</label><input id="pf-agentEmail" /></div>
      </div>

      <div class="modal__actions">
        <button type="button" class="btn-outline" data-close-modal>Cancel</button>
        <button type="submit" class="btn-gold">Save Property</button>
      </div>
    </form>
  </div>
</div>

<!-- ---------------- MODAL (Team editor) ---------------- -->
<div id="teamModal" class="modal" hidden>
  <div class="modal__panel">
    <div class="modal__head">
      <h2 id="teamModalTitle">Add Team Member</h2>
      <button class="modal__close" data-close-modal>&times;</button>
    </div>
    <form id="teamForm" class="modal__body">
      <input type="hidden" id="tf-id" />
      <div class="field"><label>Name</label><input id="tf-name" required /></div>
      <div class="field"><label>Role</label><input id="tf-role" /></div>
      <div id="tf-photo-field"></div>
      <div class="modal__actions">
        <button type="button" class="btn-outline" data-close-modal>Cancel</button>
        <button type="submit" class="btn-gold">Save Member</button>
      </div>
    </form>
  </div>
</div>

<script src="/admin/admin.js"></script>
</body>
</html>
